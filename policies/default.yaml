  token:
    action: redact_block
    severity: critical
  password:
    action: redact_block
    severity: critical
  url_secret:
    action: redact_block
    severity: critical
  financial:
    action: redact_block
    severity: critical
  email:
    action: replace_text
    severity: high
  phone:
    action: replace_text
    severity: high
  person_name:
    action: replace_text
    severity: high
  address:
    action: replace_text
    severity: high
  account_id:
    action: replace_text
    severity: high
  ip:
    action: replace_text
    severity: high
  hostname:
    action: replace_text
    severity: medium
  org_name:
    action: replace_text
    severity: medium
  face:
    action: blur
    severity: high
  free_text_pii:
    action: redact_block
    severity: high
  other:

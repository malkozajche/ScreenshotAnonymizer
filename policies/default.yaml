# Default anonymization policy

version: 1
name: default
fail_closed: true
require_human_approval: true

replacements:
  email: "user@example.com"
  person_name:
    - "Alex Rivera"
    - "Sam Patel"
    - "Jordan Lee"
  phone: "+1 555 0100"
  hostname: "app.example.com"
  account_id: "usr_example_001"
  org_name: "Acme Corp"
  ip: "10.0.0.10"

vocabulary:
  keep: []
  redact: []

